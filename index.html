<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIB MUSIC - Official</title>
  <style>
    :root {
      --primary: #ff007f;
      --bg-gradient: linear-gradient(135deg, #0f0c20, #06040a);
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-gradient);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    /* 🎵 ផ្ទាំង Music Player */
    .player-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    /* ✨ ចលនាអក្សររត់ (Text Animation) */
    .animated-title {
      font-size: 26px;
      font-weight: bold;
      background: linear-gradient(90deg, #ff007f, #00f0ff, #ff007f);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
      margin-bottom: 5px;
      letter-spacing: 2px;
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }
    .track-name {
      font-size: 14px;
      color: #bbb;
      overflow: hidden;
      white-space: nowrap;
      display: inline-block;
      animation: marquee 8s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translate3d(100%, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
    /* 📊 ចលនារលកសំឡេង Live (Audio Wave Animation) */
    .live-visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 60px;
      gap: 6px;
      margin: 25px 0;
    }
    .bar {
      width: 6px;
      background-color: var(--primary);
      border-radius: 3px;
      animation: bounce 0.5s ease-in-out infinite alternate;
    }
    .bar:nth-child(1) { height: 30px; animation-delay: 0.1s; }
    .bar:nth-child(2) { height: 50px; animation-delay: 0.3s; background-color: #00f0ff; }
    .bar:nth-child(3) { height: 15px; animation-delay: 0.5s; }
    .bar:nth-child(4) { height: 45px; animation-delay: 0.2s; background-color: #00f0ff; }
    .bar:nth-child(5) { height: 25px; animation-delay: 0.4s; }

    @keyframes bounce {
      100% { height: 8px; }
    }
    /* 🔘 ប៊ូតុងឡូកអ៊ីន */
    .btn-google {
      background: #ffffff;
      color: #222;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(255,255,255,0.1);
      transition: 0.3s;
    }
    .btn-google:hover {
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="animated-title">VIB MUSIC</div>
    <div style="width: 100%; overflow: hidden; margin-bottom: 10px;">
      <div class="track-name" id="status-text">សូមចូលគណនីដើម្បីស្តាប់តន្ត្រីរាប់ពាន់បទ 🎧</div>
    </div>

    <div class="live-visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <button class="btn-google" id="google-login-btn">
      <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" alt="Google" width="20">
      <span>ចូលជាមួយ Google</span>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    // កំណត់រចនាសម្ព័ន្ធ Firebase របស់អ្នក
    const firebaseConfig = {
      apiKey: "AIzaSyAFOIaoSLSzy-xumxEk_vd4sOhKzGUxRfs",
      authDomain: "music-online-d95b0.firebaseapp.com",
      projectId: "music-online-d95b0",
      storageBucket: "music-online-d95b0.firebasestorage.app",
      messagingSenderId: "505695260151",
      appId: "1:505695260151:web:60cb770a0c8a5c0ffeb2f2",
      measurementId: "G-G3RGP8VRNK"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // ពិនិត្យមើលស្ថានភាពឡូកអ៊ីនរបស់អ្នកប្រើប្រាស់
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // បើឡូកអ៊ីនរួចហើយ នឹងបង្ហាញឈ្មោះអ្នកប្រើប្រាស់
        document.getElementById('status-text').innerText = `សួស្តី៖ ${user.displayName} 👋 កំពុងរៀបចំប្រព័ន្ធតន្ត្រី...`;
        document.getElementById('google-login-btn').style.display = 'none';
      }
    });

    // ដំណើរការនៅពេលចុចប៊ូតុង
    document.getElementById('google-login-btn').addEventListener('click', () => {
      signInWithRedirect(auth, provider);
    });
  </script>

</body>
  </html>
