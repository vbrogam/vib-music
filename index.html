<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIB MUSIC 🔥</title>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Khmer', Arial, sans-serif;
      background: linear-gradient(135deg, #0a001f, #1a0022);
      color: white;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 20px 10px;
      background: linear-gradient(90deg, #ff0033, #ff6600);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    h1 { font-size: 28px; text-shadow: 0 0 15px #fff; }

    .container { padding: 15px; }

    .login-box { text-align: center; padding: 40px 20px; }
    .login-btn {
      width: 90%; max-width: 340px; padding: 16px; margin: 12px auto;
      border: none; border-radius: 50px; font-size: 17px; display: block;
    }
    .google-btn { background: #fff; color: #000; }
    .fb-btn { background: #1877F2; color: white; }

    .main-content { display: none; }
    .search-bar {
      width: 100%; padding: 15px; border-radius: 50px; border: none;
      background: rgba(255,255,255,0.15); color: white; font-size: 16px;
      margin-bottom: 15px;
    }

    .song-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }
    .song {
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .song img {
      width: 68px; height: 68px; border-radius: 12px; object-fit: cover;
    }

    .player {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(20,0,40,0.98); padding: 12px 15px;
      border-top: 4px solid #ff3366; z-index: 200;
    }
  </style>
</head>
<body>

  <header><h1>VIB MUSIC 🔥</h1></header>

  <div class="login-box" id="loginSection">
    <h2>ចូលគណនីដើម្បីស្តាប់</h2>
    <button class="login-btn google-btn" onclick="loginWithGoogle()">🔑 ចូលជាមួយ Google</button>
    <button class="login-btn fb-btn" onclick="loginWithFacebook()">🔑 ចូលជាមួយ Facebook</button>
  </div>

  <div id="mainContent" class="main-content container">
    <div style="text-align:center; margin-bottom:15px;">
      <p>សួស្តី <strong id="displayName"></strong> 👋</p>
      <button onclick="logout()" style="padding:8px 25px; background:#ff3366; color:white; border:none; border-radius:30px;">ចាកចេញ</button>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 ស្វែងរកបទ..." onkeyup="searchSongs()">

    <div class="song-list" id="songList"></div>
  </div>

  <div class="player" id="player" style="display:none;">
    <div style="display:flex; align-items:center; gap:12px;">
      <img id="nowPlayingImg" width="65" height="65" style="border-radius:12px;">
      <div style="flex:1;">
        <div id="nowPlayingTitle" style="font-weight:bold;"></div>
        <div id="nowPlayingArtist"></div>
      </div>
    </div>
    <audio id="audioPlayer" controls style="width:100%; margin-top:10px;"></audio>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAFOIaoSLSzy-xumxEk_vd4sOhKzGUxRfs",
      authDomain: "music-online-d95b0.firebaseapp.com",
      projectId: "music-online-d95b0",
      storageBucket: "music-online-d95b0.firebasestorage.app",
      messagingSenderId: "505695260151",
      appId: "1:505695260151:web:a8fa466c3f2fa911feb2f2"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let songs = [];
    for(let i = 1; i <= 40; i++) {
      songs.push({
        id: i,
        title: `VIB បទទី ${i}`,
        artist: "សិល្បករ Vib",
        cover: `https://picsum.photos/id/${100 + i}/300`,
        url: `https://www.soundhelix.com/examples/mp3/SoundHelix-Song-${(i % 17) + 1}.mp3`
      });
    }

    function renderSongs(filtered) {
      const container = document.getElementById('songList');
      container.innerHTML = '';
      filtered.forEach(song => {
        const div = document.createElement('div');
        div.className = 'song';
        div.innerHTML = `<img src="\( {song.cover}"><div style="flex:1;"><div style="font-weight:bold;"> \){song.title}</div><div>${song.artist}</div></div>`;
        div.onclick = () => playSong(song);
        container.appendChild(div);
      });
    }

    function playSong(song) {
      document.getElementById('audioPlayer').src = song.url;
      document.getElementById('nowPlayingTitle').textContent = song.title;
      document.getElementById('nowPlayingArtist').textContent = song.artist;
      document.getElementById('nowPlayingImg').src = song.cover;
      document.getElementById('player').style.display = 'block';
      document.getElementById('audioPlayer').play();
    }

    function searchSongs() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = songs.filter(s => s.title.toLowerCase().includes(term));
      renderSongs(filtered);
    }

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).then(r => showLoggedIn(r.user));
    }

    function loginWithFacebook() {
      const provider = new firebase.auth.FacebookAuthProvider();
      auth.signInWithPopup(provider).then(r => showLoggedIn(r.user));
    }

    function showLoggedIn(user) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('displayName').textContent = user.displayName || "User";
    }

    function logout() {
      auth.signOut().then(() => {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('mainContent').style.display = 'none';
      });
    }

    renderSongs(songs);
  </script>
</body>
</html>
